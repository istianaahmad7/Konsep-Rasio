<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Interaktif: Jagoan Rasio</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka One', cursive;
        }
        .item-bounce {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const ITEMS = [
            { name: "Bintang Kuning", icon: "⭐" },
            { name: "Bintang Biru", icon: "💠" },
            { name: "Apel Merah", icon: "🍎" },
            { name: "Apel Hijau", icon: "🍏" },
            { name: "Bola Sepak", icon: "⚽" },
            { name: "Bola Basket", icon: "🏀" },
            { name: "Kucing", icon: "🐱" },
            { name: "Anjing", icon: "🐶" }
        ];

        function App() {
            const [gameState, setGameState] = React.useState('start'); // start, playing, finished
            const [groups, setGroups] = React.useState([
                { id: 1, name: 'Kelompok 1', score: 0, color: 'bg-red-200 border-red-500 text-red-700' },
                { id: 2, name: 'Kelompok 2', score: 0, color: 'bg-blue-200 border-blue-500 text-blue-700' },
                { id: 3, name: 'Kelompok 3', score: 0, color: 'bg-green-200 border-green-500 text-green-700' }
            ]);
            const [currentTurn, setCurrentTurn] = React.useState(0);
            const [currentStep, setCurrentStep] = React.useState(1);
            
            // State untuk soal saat ini
            const [question, setQuestion] = React.useState(null);
            
            // State input pengguna
            const [inputA, setInputA] = React.useState('');
            const [inputB, setInputB] = React.useState('');
            const [feedback, setFeedback] = React.useState(null); // { type: 'success'|'error', text: '' }

            const playApplause = () => {
                try {
                    // Bunyi chord sukses (nada gembira)
                    const polySynth = new Tone.PolySynth(Tone.Synth, {
                        envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
                    }).toDestination();
                    polySynth.volume.value = -5;
                    polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n");
                    
                    // Bunyi riuh (simulasi tepuk tangan dengan filter noise)
                    const noise = new Tone.NoiseSynth({
                        noise: { type: "white" },
                        envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 2 }
                    }).toDestination();
                    noise.volume.value = -10;
                    noise.triggerAttackRelease("1m");
                } catch (e) { console.error("Tone.js error:", e); }
            };

            const playBomb = () => {
                try {
                    // Suara dentuman rendah (bom)
                    const drum = new Tone.MembraneSynth({
                        pitchDecay: 0.1,
                        octaves: 6,
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.01, decay: 0.8, sustain: 0.01, release: 1.5 }
                    }).toDestination();
                    drum.volume.value = 5;
                    drum.triggerAttackRelease("C1", "2n");

                    // Suara ledakan (noise yang kasar)
                    const noise = new Tone.NoiseSynth({
                        noise: { type: "brown" },
                        envelope: { attack: 0.01, decay: 0.6, sustain: 0.1, release: 1.5 }
                    }).toDestination();
                    noise.volume.value = -5;
                    noise.triggerAttackRelease("2n");
                } catch (e) { console.error("Tone.js error:", e); }
            };

            const generateQuestion = () => {
                let idx1 = Math.floor(Math.random() * ITEMS.length);
                let idx2;
                do {
                    idx2 = Math.floor(Math.random() * ITEMS.length);
                } while (idx1 === idx2);

                const count1 = Math.floor(Math.random() * 7) + 2; // 2 to 8 items
                const count2 = Math.floor(Math.random() * 7) + 2;

                setQuestion({
                    itemA: ITEMS[idx1],
                    itemB: ITEMS[idx2],
                    countA: count1,
                    countB: count2
                });
                setCurrentStep(1);
                setInputA('');
                setInputB('');
                setFeedback(null);
            };

            const startGame = async () => {
                if (window.Tone && Tone.context.state !== 'running') {
                    await Tone.start();
                }
                setGameState('playing');
                generateQuestion();
            };

            const addScore = (groupIdx, points) => {
                setGroups(prev => {
                    const newGroups = [...prev];
                    newGroups[groupIdx].score += points;
                    return newGroups;
                });
            };

            const showFeedback = (isCorrect, correctText) => {
                if (isCorrect) {
                    playApplause();
                    setFeedback({ type: 'success', text: 'Tepat Sekali! +1 Poin' });
                    addScore(currentTurn, 1);
                    setTimeout(() => {
                        if (currentStep < 4) {
                            setCurrentStep(prev => prev + 1);
                            setFeedback(null);
                            setInputA('');
                            setInputB('');
                        } else {
                            nextTurn();
                        }
                    }, 2000);
                } else {
                    playBomb();
                    setFeedback({ type: 'error', text: `Kurang Tepat! ${correctText}` });
                    setTimeout(() => {
                        if (currentStep < 4) {
                            setCurrentStep(prev => prev + 1);
                            setFeedback(null);
                            setInputA('');
                            setInputB('');
                        } else {
                            nextTurn();
                        }
                    }, 3500);
                }
            };

            const nextTurn = () => {
                setCurrentTurn((prev) => (prev + 1) % 3);
                generateQuestion();
            };

            const checkStep1 = () => {
                const isCorrect = parseInt(inputA) === question.countA && parseInt(inputB) === question.countB;
                showFeedback(isCorrect, `Jawabannya adalah ${question.countA} ${question.itemA.name} dan ${question.countB} ${question.itemB.name}.`);
            };

            const checkStep2 = () => {
                const isCorrect = parseInt(inputA) === question.countA && parseInt(inputB) === question.countB;
                showFeedback(isCorrect, `Seharusnya: Rasio ${question.itemA.name} terhadap ${question.itemB.name} adalah ${question.countA} berbanding ${question.countB}.`);
            };

            const checkStep3 = (answer) => {
                const isCorrect = answer === `${question.countA}:${question.countB}`;
                showFeedback(isCorrect, `Notasi yang benar adalah ${question.countA} : ${question.countB}`);
            };

            const checkStep4 = (answer) => {
                const isCorrect = answer === `${question.countB}:${question.countA}`;
                showFeedback(isCorrect, `Jika dibalik, notasinya menjadi ${question.countB} : ${question.countA}`);
            };

            const renderScoreBoard = () => (
                <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-md mb-6 max-w-4xl mx-auto w-full border-4 border-indigo-100">
                    {groups.map((g, idx) => (
                        <div key={g.id} className={`flex flex-col items-center p-3 rounded-xl border-4 w-1/3 mx-2 transition-all ${idx === currentTurn ? g.color + ' scale-110 shadow-lg' : 'bg-gray-50 border-gray-200 text-gray-500 opacity-70'}`}>
                            <h3 className="font-heading text-xl">{g.name}</h3>
                            <p className="text-4xl font-bold font-heading my-2">{g.score}</p>
                            {idx === currentTurn && gameState === 'playing' && (
                                <button 
                                    onClick={() => { addScore(idx, 1); alert(`+1 Poin Penjelasan untuk ${g.name}!`); }}
                                    className="mt-2 text-xs bg-yellow-400 text-yellow-900 font-bold py-1 px-3 rounded-full hover:bg-yellow-300 shadow active:scale-95 transition"
                                >
                                    ✨ Bonus Penjelasan (+1)
                                </button>
                            )}
                        </div>
                    ))}
                </div>
            );

            const renderVisual = () => {
                if (!question) return null;
                const itemsA = Array.from({ length: question.countA });
                const itemsB = Array.from({ length: question.countB });

                return (
                    <div className="bg-white rounded-3xl p-6 shadow-lg mb-6 border-4 border-dashed border-indigo-200 text-center">
                        <h2 className="text-xl font-bold text-slate-700 mb-4 font-heading">Perhatikan susunan berikut:</h2>
                        <div className="flex justify-center flex-wrap gap-6 text-6xl">
                            <div className="flex flex-wrap justify-center gap-2 max-w-xs p-4 bg-indigo-50 rounded-2xl">
                                {itemsA.map((_, i) => (
                                    <span key={`a-${i}`} className="item-bounce" style={{animationDelay: `${i * 0.1}s`}} title={question.itemA.name}>{question.itemA.icon}</span>
                                ))}
                            </div>
                            <div className="flex flex-wrap justify-center gap-2 max-w-xs p-4 bg-fuchsia-50 rounded-2xl">
                                {itemsB.map((_, i) => (
                                    <span key={`b-${i}`} className="item-bounce" style={{animationDelay: `${i * 0.1}s`}} title={question.itemB.name}>{question.itemB.icon}</span>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderChallenge = () => {
                if (!question) return null;

                return (
                    <div className="bg-white rounded-3xl p-6 shadow-xl max-w-2xl mx-auto border-4 border-indigo-400 relative">
                        {/* Notifikasi Feedback (Benar/Salah) */}
                        {feedback && (
                            <div className={`absolute top-0 left-0 w-full h-full flex items-center justify-center rounded-2xl z-10 bg-opacity-90 ${feedback.type === 'success' ? 'bg-green-100' : 'bg-red-100'}`}>
                                <div className={`text-3xl font-heading text-center p-8 rounded-2xl shadow-2xl ${feedback.type === 'success' ? 'text-green-600 bg-white' : 'text-red-600 bg-white'}`}>
                                    {feedback.type === 'success' ? '🎉' : '❌'} <br/> {feedback.text}
                                </div>
                            </div>
                        )}

                        <div className="mb-4 inline-block bg-indigo-600 text-white font-bold px-4 py-1 rounded-full text-sm">
                            Tantangan {currentStep} / 4
                        </div>

                        {/* Tantangan 1: Hitung Jumlah */}
                        {currentStep === 1 && (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-6">Pilih jumlah masing-masing kelompok benda!</h3>
                                <div className="flex justify-center items-center gap-4 text-xl">
                                    <div className="flex flex-col items-center">
                                        <span className="text-4xl mb-2">{question.itemA.icon}</span>
                                        <input type="number" value={inputA} onChange={e => setInputA(e.target.value)} className="w-20 text-center border-4 border-indigo-200 rounded-xl p-2 text-2xl font-bold focus:outline-none focus:border-indigo-500" placeholder="?" />
                                    </div>
                                    <span className="font-bold text-slate-400 text-3xl">&</span>
                                    <div className="flex flex-col items-center">
                                        <span className="text-4xl mb-2">{question.itemB.icon}</span>
                                        <input type="number" value={inputB} onChange={e => setInputB(e.target.value)} className="w-20 text-center border-4 border-fuchsia-200 rounded-xl p-2 text-2xl font-bold focus:outline-none focus:border-fuchsia-500" placeholder="?" />
                                    </div>
                                </div>
                                <button onClick={checkStep1} disabled={!inputA || !inputB} className="mt-8 bg-indigo-500 hover:bg-indigo-600 disabled:opacity-50 text-white font-heading text-xl py-3 px-8 rounded-full shadow-lg transition-transform active:scale-95">
                                    Cek Jawaban
                                </button>
                            </div>
                        )}

                        {/* Tantangan 2: Lengkapi Kalimat */}
                        {currentStep === 2 && (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-6">Lengkapi kalimat rasio di bawah ini!</h3>
                                <p className="text-xl leading-relaxed bg-gray-50 p-6 rounded-2xl border-2 border-gray-200">
                                    "Rasio {question.itemA.name} {question.itemA.icon} terhadap {question.itemB.name} {question.itemB.icon} adalah <br/>
                                    <input type="number" value={inputA} onChange={e => setInputA(e.target.value)} className="w-16 text-center border-b-4 border-indigo-400 bg-transparent mx-2 text-2xl font-bold focus:outline-none" /> 
                                    berbanding 
                                    <input type="number" value={inputB} onChange={e => setInputB(e.target.value)} className="w-16 text-center border-b-4 border-fuchsia-400 bg-transparent mx-2 text-2xl font-bold focus:outline-none" />."
                                </p>
                                <button onClick={checkStep2} disabled={!inputA || !inputB} className="mt-8 bg-indigo-500 hover:bg-indigo-600 disabled:opacity-50 text-white font-heading text-xl py-3 px-8 rounded-full shadow-lg transition-transform active:scale-95">
                                    Cek Jawaban
                                </button>
                            </div>
                        )}

                        {/* Tantangan 3: Pilih Notasi */}
                        {currentStep === 3 && (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-6">Pilih notasi matematika yang tepat!</h3>
                                <p className="text-lg mb-6">Untuk rasio {question.itemA.name} terhadap {question.itemB.name}:</p>
                                <div className="flex justify-center gap-6">
                                    <button onClick={() => checkStep3(`${question.countA}:${question.countB}`)} className="bg-white border-4 border-indigo-200 hover:border-indigo-500 text-indigo-700 font-heading text-4xl py-6 px-10 rounded-2xl shadow-md transition-all hover:shadow-xl active:scale-95">
                                        {question.countA} : {question.countB}
                                    </button>
                                    <button onClick={() => checkStep3(`${question.countB}:${question.countA}`)} className="bg-white border-4 border-indigo-200 hover:border-indigo-500 text-indigo-700 font-heading text-4xl py-6 px-10 rounded-2xl shadow-md transition-all hover:shadow-xl active:scale-95">
                                        {question.countB} : {question.countA}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Tantangan 4: Ubah Urutan (Dibalik) */}
                        {currentStep === 4 && (
                            <div className="text-center">
                                <h3 className="text-2xl font-bold mb-6">Bagaimana jika urutannya DIBALIK?</h3>
                                <p className="text-lg mb-6 bg-yellow-50 p-4 rounded-xl border-2 border-yellow-200 text-yellow-800">
                                    Tentukan Rasio <strong className="text-fuchsia-600">{question.itemB.name} {question.itemB.icon}</strong> terhadap <strong className="text-indigo-600">{question.itemA.name} {question.itemA.icon}</strong>!
                                </p>
                                <div className="flex justify-center gap-6">
                                    <button onClick={() => checkStep4(`${question.countA}:${question.countB}`)} className="bg-white border-4 border-orange-200 hover:border-orange-500 text-orange-700 font-heading text-4xl py-6 px-10 rounded-2xl shadow-md transition-all hover:shadow-xl active:scale-95">
                                        {question.countA} : {question.countB}
                                    </button>
                                    <button onClick={() => checkStep4(`${question.countB}:${question.countA}`)} className="bg-white border-4 border-orange-200 hover:border-orange-500 text-orange-700 font-heading text-4xl py-6 px-10 rounded-2xl shadow-md transition-all hover:shadow-xl active:scale-95">
                                        {question.countB} : {question.countA}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto">
                    <header className="text-center mb-8">
                        <h1 className="text-4xl md:text-5xl text-indigo-800 drop-shadow-md mb-2">✨ Jagoan Rasio! ✨</h1>
                        <p className="text-lg text-indigo-600 font-bold">Game Matematika Kelas 6</p>
                    </header>

                    {gameState === 'start' && (
                        <div className="flex flex-col items-center bg-white p-10 rounded-3xl shadow-xl max-w-2xl mx-auto border-4 border-indigo-200">
                            <h2 className="text-2xl font-heading text-slate-700 mb-4">Aturan Main:</h2>
                            <ul className="text-left text-lg space-y-3 mb-8 bg-indigo-50 p-6 rounded-xl text-indigo-900 w-full">
                                <li>🥇 Terdapat 3 kelompok yang bermain bergantian.</li>
                                <li>🎯 Setiap giliran ada 4 tantangan rasio berturut-turut.</li>
                                <li>✅ Jawaban benar dari aplikasi mendapat <strong>+1 Poin</strong>.</li>
                                <li>🎤 Jika guru menilai penjelasan siswa bagus, klik tombol <strong>"Bonus Penjelasan"</strong> untuk tambahan +1 Poin.</li>
                            </ul>
                            <button onClick={startGame} className="bg-green-500 hover:bg-green-600 text-white font-heading text-2xl py-4 px-10 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95">
                                MULAI BERMAIN! 🚀
                            </button>
                        </div>
                    )}

                    {gameState === 'playing' && (
                        <div>
                            {renderScoreBoard()}
                            <div className="bg-indigo-600 text-white text-center py-2 px-6 rounded-full inline-block mx-auto font-bold mb-6 text-lg shadow-md animate-pulse relative left-1/2 transform -translate-x-1/2">
                                👉 Giliran {groups[currentTurn].name} 👈
                            </div>
                            
                            {renderVisual()}
                            {renderChallenge()}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
